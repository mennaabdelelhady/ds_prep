<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero to Hero: ITI Data Science 2026 Roadmap</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0e1c;--panel:#141a33;--line:#2a3360;--red:#e5383b;--gold:#f6b93b;--steel:#9fb0d6;--text:#eef1fb;--done:#3ddc97;
--head:'Anton','Impact','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font:400 17px/1.5 var(--body);min-height:100vh}
#sky{position:fixed;inset:0;z-index:0;width:100%;height:100%}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:28px 18px 80px}
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:28px 0 20px}
h1{font:400 clamp(48px,11vw,104px)/.9 var(--head);margin:0;letter-spacing:.01em;text-transform:uppercase;
 background:linear-gradient(180deg,var(--text) 40%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent;
 transform:skew(-6deg)}
.sub{color:var(--steel);margin:10px 0 0;max-width:34ch}
.meter{position:relative;width:190px;height:190px}
.meter svg{width:100%;height:100%;transform:rotate(-90deg)}
.meter circle{fill:none;stroke-width:12}
.meter .bg{stroke:var(--line)}
.meter .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.meter .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.num b{font:400 44px/1 var(--head)}
.num span{color:var(--steel);font-size:14px}
.rank{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;border:2px solid var(--gold);background:var(--panel);
 padding:14px 18px;margin:6px 0 22px;box-shadow:6px 6px 0 var(--red)}
.rank strong{font:400 32px/1 var(--head);color:var(--gold);text-transform:uppercase;letter-spacing:.03em}
.rank span{color:var(--steel)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
button{font:600 15px var(--body);color:var(--text);background:var(--panel);border:2px solid var(--line);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--steel)}
button[aria-pressed=true]{background:var(--red);border-color:var(--red)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.reset{margin-left:auto;color:var(--steel)}
.phase{background:var(--panel);border:2px solid var(--line);margin-bottom:18px;position:relative}
.phase.clear{border-color:var(--done)}
.phase>header{padding:16px 18px;display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--line)}
.phase h2{font:400 26px/1.1 var(--head);margin:0;text-transform:uppercase;letter-spacing:.02em}
.phase .tag{color:var(--steel);font-size:15px;margin:2px 0 0}
.phase .pill{margin-left:auto;text-align:right;font:400 22px var(--head);color:var(--gold);white-space:nowrap}
.phase .pill small{display:block;font:600 13px var(--body);color:var(--steel)}
.stamp{position:absolute;right:14px;top:-14px;background:var(--done);color:#052;font:400 18px var(--head);padding:2px 12px;
 transform:rotate(4deg) scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1);text-transform:uppercase}
.phase.clear .stamp{transform:rotate(4deg) scale(1)}
.phase .track{height:6px;background:var(--line)}
.phase .track i{display:block;height:100%;width:0;background:var(--gold);transition:width .6s}
.phase.clear .track i{background:var(--done)}
ul{list-style:none;margin:0;padding:6px 0}
li{position:relative}
label{display:flex;gap:14px;align-items:center;padding:11px 18px;cursor:pointer}
label:hover{background:#1a2142}
input{appearance:none;flex:none;width:26px;height:26px;border:3px solid var(--steel);background:transparent;display:grid;place-content:center;margin:0;cursor:pointer;transform:skew(-6deg)}
input::after{content:"";width:12px;height:12px;background:var(--done);transform:scale(0);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
input:checked{border-color:var(--done)}
input:checked::after{transform:scale(1)}
.t{flex:1}
.t a{color:var(--gold);font-size:14px;margin-left:8px}
.h{color:var(--steel);font-size:14px;white-space:nowrap}
li.done .t span{color:var(--steel);text-decoration:line-through;text-decoration-color:var(--red)}
.sub{padding:0 0 10px 58px}
.sub label{padding:5px 18px 5px 0;font-size:15px;gap:10px}
.sub label:hover{background:none}
.sub input{width:18px;height:18px;border-width:2px}
.sub input::after{width:8px;height:8px}
.sub .vid{padding:0 0 4px 30px}
.vid label{padding:3px 0;font-size:14px;color:var(--steel)}
.vid input{width:15px;height:15px;border-width:2px}
.vid input::after{width:6px;height:6px}
li.hide{display:none}
.boss{border-color:var(--red)}
.pow{position:fixed;z-index:9;pointer-events:none;font:400 34px var(--head);color:var(--gold);text-shadow:3px 3px 0 var(--red);
 animation:pow .8s ease-out forwards;text-transform:uppercase}
@keyframes pow{0%{transform:translate(-50%,0) scale(.3) rotate(-12deg);opacity:0}25%{opacity:1;transform:translate(-50%,-20px) scale(1.2) rotate(6deg)}100%{transform:translate(-50%,-80px) scale(1) rotate(-4deg);opacity:0}}
footer{color:var(--steel);font-size:14px;text-align:center;margin-top:36px}
@media(max-width:640px){.hero{grid-template-columns:1fr}.meter{width:150px;height:150px}.num b{font-size:34px}.phase .pill{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <section class="hero">
    <div>
      <h1>Zero to Hero</h1>
      <p class="sub">Your mission log for the ITI Intensive Code Camp: Data Science 2026. Tick a mission, earn your rank.</p>
    </div>
    <div class="meter" role="img" aria-label="Overall progress">
      <svg viewBox="0 0 190 190"><circle class="bg" cx="95" cy="95" r="82"/><circle class="fg" id="ring" cx="95" cy="95" r="82"/></svg>
      <div class="num"><b id="pct">0%</b><span id="hrs">0 / 0 hrs</span></div>
    </div>
  </section>
  <div class="rank"><strong id="rank">Civilian</strong><span id="next"></span></div>
  <div class="bar">
    <button data-f="all" aria-pressed="true">All missions</button>
    <button data-f="todo" aria-pressed="false">To do</button>
    <button data-f="done" aria-pressed="false">Done</button>
    <button class="reset" id="reset">Reset progress</button>
  </div>
  <div id="phases"></div>
  <footer>Unofficial fan project. Not affiliated with ITI. Always check <a href="https://www.iti.gov.eg" style="color:var(--gold)">iti.gov.eg</a> for current dates and requirements.</footer>
</main>
<script>
const KS="https://www.khanacademy.org/math/statistics-probability",KG="https://www.kaggle.com/learn/";
const PHASES=[
{n:"Origin Story",tag:"Before you apply: finish these and be ready for the interview.",m:[
 ["Finish the Database Fundamentals course on Maharatech",0,0,"https://maharatech.gov.eg/course/view.php?id=740"],
 ["Watch the Career Talk in Data Analytics",0,0,"https://maharatech.gov.eg/mod/hvp/view.php?id=4197"],
 ["Refresh the basics for the interview",0,["Stats: mean, variance, normal distribution, p-value@@"+KS,"ML: supervised vs unsupervised, overfitting, train/test split","DL: neurons, layers, backpropagation at a high level@@https://www.3blue1brown.com/topics/neural-networks"]],
 ["Learn the data analytics life cycle",0,["Know the stages: define, collect, clean, explore, model, communicate","Pick one small dataset and walk it through each stage"]],
 ["Check official ITI channels for the application link and deadline",0,0,"https://www.iti.gov.eg"]]},
{n:"Phase 1: Data Fundamentals",tag:"12% of the track. Learn where data lives and how to ask it questions.",m:[
 ["Operating Systems and Network Workshop",18,["Linux basics: files, permissions, processes@@https://linuxjourney.com","Networking: IP, DNS, HTTP, ports@@https://www.netacad.com/courses/networking-basics","Practice 10 terminal commands every day"]],
 ["Database Fundamentals",27,["Relational model, primary and foreign keys","Normalization (1NF to 3NF) and ER diagrams","Joins and CRUD practice@@https://sqlbolt.com@@1: SELECT queries 101|2: Queries with constraints (Pt. 1)|3: Queries with constraints (Pt. 2)|4: Filtering and sorting results|5: SELECT review|6: Multi-table queries with JOINs|7: OUTER JOINs|8: A short note on NULLs|9: Queries with expressions|10: Queries with aggregates (Pt. 1)|11: Queries with aggregates (Pt. 2)|12: Order of execution|13: Inserting rows|14: Updating rows|15: Deleting rows|16: Creating tables|17: Altering tables|18: Dropping tables","Maharatech DB course@@https://maharatech.gov.eg/course/view.php?id=740"]],
 ["Advanced SQL",18,["Subqueries and CTEs","Window functions: ROW_NUMBER, RANK, LAG","Indexes, views, transactions@@"+KG+"advanced-sql@@JOINs and UNIONs|Analytic Functions|Nested and Repeated Data|Writing Efficient Queries"]],
 ["Analytical SQL",18,["GROUP BY, HAVING, aggregates","Running totals and cohorts with window functions","Solve 20 analytics queries on a sample database"]]]},
{n:"Phase 2: Systems and Dev Skills",tag:"10% of the track. Your toolbelt: Linux, Python, algorithms, prompts.",m:[
 ["Red Hat System Administration I",30,["Users, groups, permissions","Packages (dnf) and services (systemctl)","Bash scripting basics","Storage and networking basics@@https://linuxjourney.com"]],
 ["Python Programming",30,["Syntax, types, control flow, functions@@"+KG+"python@@Hello, Python|Functions and Getting Help|Booleans and Conditionals|Lists|Loops and List Comprehensions|Strings and Dictionaries|Working with External Libraries","Lists, dicts, comprehensions, files","Classes and error handling","Full course with exercises: Harvard CS50P@@https://cs50.harvard.edu/python/@@Lecture 0: Functions and Variables|Lecture 1: Conditionals|Lecture 2: Loops|Lecture 3: Exceptions|Lecture 4: Libraries|Lecture 5: Unit Tests|Lecture 6: File I/O|Lecture 7: Regular Expressions|Lecture 8: Object-Oriented Programming|Lecture 9: Et Cetera","Prefer Arabic? Watch Elzero Web School’s Python course@@https://www.youtube.com/@ElzeroWebSchool"]],
 ["Intro to Generative AI and prompt engineering",6,["How LLMs work at a high level","Prompt patterns: role, examples, step by step@@https://www.promptingguide.ai"]],
 ["Algorithms and Data Structures (fundamentals)",12,["Big-O basics","Arrays, stacks, queues, hash maps","Sorting and binary search","Follow NeetCode’s beginner roadmap and solve 15 easy problems@@https://neetcode.io/roadmap"]]]},
{n:"Phase 3: Statistics and Math",tag:"20% of the track. The physics behind every model.",m:[
 ["Business Statistics",36,["Descriptive stats: mean, median, variance, std","Probability and distributions (normal, binomial)@@"+KS,"Hypothesis tests, p-values, confidence intervals: StatQuest’s Statistics Fundamentals playlist@@https://www.youtube.com/@statquest","Correlation and simple regression"]],
 ["Linear Algebra for Data Science",30,["Vectors, matrices, dot product","Matrix multiplication, inverse, determinant","Watch 3Blue1Brown’s Essence of Linear Algebra@@https://www.3blue1brown.com/topics/linear-algebra@@1: Vectors|2: Linear combinations, span, basis|3: Linear transformations and matrices|4: Matrix multiplication as composition|5: Three-dimensional transformations|6: The determinant|7: Inverse matrices, column space, null space|8: Nonsquare matrices|9: Dot products and duality|10: Cross products|11: Cross products and transformations|12: Cramer’s rule|13: Change of basis|14: Eigenvectors and eigenvalues|15: A quick trick for eigenvalues|16: Abstract vector spaces"]],
 ["Calculus for Data Science",18,["Watch 3Blue1Brown’s Essence of Calculus@@https://www.3blue1brown.com/topics/calculus@@1: The essence of calculus|2: The paradox of the derivative|3: Derivative formulas through geometry|4: Chain rule and product rule|5: Euler’s number e and exponentials|6: Implicit differentiation|7: Limits and L’Hôpital’s rule|8: Integration and the fundamental theorem|9: What area has to do with slope|10: Higher order derivatives|11: Taylor series","Partial derivatives and gradients","Integral basics@@https://www.khanacademy.org/math/calculus-1"]],
 ["Numerical Optimization for Data Science",30,["Gradient descent by hand, then in NumPy@@https://www.3blue1brown.com/topics/neural-networks","Learning rate; convex vs non-convex","Newton’s method and constraints intro"]]]},
{n:"Phase 4: Data Prep, ML and AI",tag:"40% of the track. The main event.",m:[
 ["Data Preparation and Preprocessing",24,["pandas: load, filter, groupby, merge@@"+KG+"pandas@@Creating, Reading and Writing|Indexing, Selecting and Assigning|Summary Functions and Maps|Grouping and Sorting|Data Types and Missing Values|Renaming and Combining","Missing values and outliers@@"+KG+"data-cleaning@@Handling missing values|Scaling and normalization|Parsing dates|Character encodings|Inconsistent data entry","Encoding, scaling, feature engineering"]],
 ["Machine Learning",30,["Supervised vs unsupervised: Andrew Ng’s ML course (audit for free)@@https://www.coursera.org/specializations/machine-learning-introduction@@Course 1: Supervised ML: Regression and Classification|Course 2: Advanced Learning Algorithms|Course 3: Unsupervised Learning, Recommenders, Reinforcement Learning","Linear and logistic regression, trees, random forest, KNN, k-means","Cross-validation and metrics (accuracy, F1, RMSE)","Build models with scikit-learn@@"+KG+"intro-to-machine-learning@@How Models Work|Basic Data Exploration|Your First Machine Learning Model|Model Validation|Underfitting and Overfitting|Random Forests"]],
 ["Deep Learning and Sequential Modeling",24,["Neural network basics and backpropagation@@https://www.3blue1brown.com/topics/neural-networks@@But what is a neural network?|Gradient descent: how neural networks learn|Backpropagation, intuitively|Backpropagation calculus","CNNs for images","RNN, LSTM, attention intro","Train one model with Keras@@"+KG+"intro-to-deep-learning@@A Single Neuron|Deep Neural Networks|Stochastic Gradient Descent|Overfitting and Underfitting|Dropout and Batch Normalization|Binary Classification"]],
 ["Python for Data Science",12,["NumPy arrays@@https://numpy.org/doc/stable/user/absolute_beginners.html","pandas and matplotlib/seaborn@@"+KG+"data-visualization@@Hello, Seaborn|Line Charts|Bar Charts and Heatmaps|Scatter Plots|Distributions|Choosing Plot Types","Jupyter notebook workflow@@https://jupyter.org/try"]],
 ["Agentic AI: frameworks, architecture, evaluation",12,["Agents: tools, memory, planning","Build a simple tool-using agent@@https://huggingface.co/learn/agents-course@@Unit 0: Welcome|Unit 1: Introduction to agents|Unit 2: Agent frameworks|Unit 3: Use case|Unit 4: Final project","How to evaluate agent outputs"]],
 ["Workshop: build a chatbot with RAG",3,["Embeddings and vector search","Chunk, retrieve, generate@@https://python.langchain.com/docs/tutorials/rag/"]],
 ["MLOps for Data Science",33,["Learn Git the visual way@@https://learngitbranching.js.org","Track experiments with MLflow@@https://mlflow.org","Docker basics@@https://docs.docker.com/get-started/","CI/CD for models","Monitoring and data drift@@https://madewithml.com"]],
 ["Deployment Toolkit",15,["Serve a model with FastAPI@@https://fastapi.tiangolo.com/tutorial/","Containerize and deploy it","Test the endpoint"]],
 ["SAS Programming Essentials (SAS Viya) and Data Manipulation",12,["SAS Viya Studio basics@@https://www.sas.com/en_us/software/viya-for-learners.html","DATA step and PROC SQL","Merge, sort, format data"]]]},
{n:"Phase 5: Visualization",tag:"7% of the track. Make the data tell its story.",m:[
 ["Visualization and Storytelling with Power BI",30,["Import and model data in Power BI Desktop@@https://learn.microsoft.com/en-us/power-bi/fundamentals/desktop-getting-started","DAX basics: measures, CALCULATE","Build a one-page dashboard","Storytelling: chart choice, titles, layout"]]]},
{n:"Phase 6: Employability",tag:"11% of the track. Turn skills into a job.",m:[
 ["Effective Presentation Skills",18,["Structure: problem, insight, action","Give a 5-minute demo of one project"]],
 ["Freelancing Fundamentals",12,["Create a profile on one freelancing platform","Learn proposals and pricing"]],
 ["Effective Communication Skills",12,["Write clear emails and status updates","Explain a model to a non-technical friend"]],
 ["Work Ethics Workshop",3,["Review professional conduct: deadlines, honesty, teamwork"]],
 ["CV Writing and Interviewing Skills",15,["One-page CV with project links","Prepare 5 interview stories (situation, action, result)","Do a mock interview"]]]},
{n:"Final Boss",tag:"The track’s official target certification.",boss:1,m:[
 ["Pass Microsoft Certified: Azure AI Fundamentals",0,["Study the official Microsoft Learn course (check if your exam is AI-900 or the newer AI-901)@@https://learn.microsoft.com/en-us/credentials/certifications/azure-ai-fundamentals/@@AI overview: AI concepts, ML, Azure AI services|Computer vision|Natural language processing|Document intelligence and knowledge mining|Generative AI","Take the free practice assessment","Book the exam"]]]}
];
const RANKS=[[0,"Civilian"],[1,"Recruit"],[20,"Sidekick"],[45,"Field Agent"],[70,"Vanguard"],[95,"Hero"]];
const KEY="iti-ds-roadmap-v2";
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const setS=(k,v)=>{if(v)state[k]=1;else delete state[k]};
const W=h=>h||8,$=s=>document.querySelector(s),root=$("#phases");
let filter="all";
const lnk=u=>u?` <a href="${u}" target="_blank" rel="noopener">${/youtu/.test(u)?"watch":"study"}</a>`:"";
const parts=x=>{const[a,u,v]=x.split("@@");return{a,u,v:v?v.split("|"):[]}};
const leaves=(id,subs)=>subs.flatMap((x,k)=>{const n=parts(x).v.length;return n?Array.from({length:n},(_,j)=>id+"."+k+"."+j):[id+"."+k]});
PHASES.forEach((p,pi)=>{
 const sec=document.createElement("section");sec.className="phase"+(p.boss?" boss":"");sec.id="p"+pi;
 sec.innerHTML=`<span class="stamp">Cleared</span><header><div><h2>${p.n}</h2><p class="tag">${p.tag}</p></div><div class="pill"><span class="c"></span><small class="hh"></small></div></header><div class="track"><i></i></div><ul></ul>`;
 const ul=sec.querySelector("ul");
 p.m.forEach((m,mi)=>{
  const id=pi+"-"+mi,subs=m[2]||[],li=document.createElement("li");li.dataset.id=id;
  li.innerHTML=`<label><input type="checkbox" class="mn"><span class="t"><span>${m[0]}</span>${lnk(m[3])}</span><span class="h">${m[1]?m[1]+" hrs":""}</span></label>`+
   (subs.length?`<ul class="sub">${subs.map((x,k)=>{const q=parts(x),key=id+"."+k;return `<li><label><input type="checkbox" class="sb" data-k="${key}" data-n="${q.v.length}"><span class="t"><span>${q.a}</span>${lnk(q.u)}</span><span class="h">${q.v.length?q.v.length+" videos":""}</span></label>`+
    (q.v.length?`<ul class="vid">${q.v.map((y,j)=>`<li><label><input type="checkbox" data-k="${key}.${j}"><span class="t"><span>${y}</span></span></label></li>`).join("")}</ul>`:"")+`</li>`}).join("")}</ul>`:"");
  li.addEventListener("change",e=>{const t=e.target;if(t.type!=="checkbox")return;
   if(t.classList.contains("mn")){if(subs.length)leaves(id,subs).forEach(k=>setS(k,t.checked));else setS(id,t.checked)}
   else if(t.classList.contains("sb")&&+t.dataset.n){for(let j=0;j<+t.dataset.n;j++)setS(t.dataset.k+"."+j,t.checked)}
   else setS(t.dataset.k,t.checked);
   if(t.checked)pow(t);save();render()});
  li.querySelectorAll("a").forEach(a=>a.addEventListener("click",e=>e.stopPropagation()));
  ul.appendChild(li)});
 root.appendChild(sec)});
const WORDS=["POW!","BAM!","ZAP!","BOOM!","WHAM!"];
function pow(el){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const r=el.getBoundingClientRect(),d=document.createElement("div");d.className="pow";
 d.textContent=WORDS[Math.random()*WORDS.length|0];d.style.left=r.left+14+"px";d.style.top=r.top-10+"px";
 document.body.appendChild(d);setTimeout(()=>d.remove(),850)}
const C=2*Math.PI*82,ring=$("#ring");ring.style.strokeDasharray=C;ring.style.strokeDashoffset=C;
function render(){
 let tot=0,got=0,hTot=0,hGot=0;
 PHASES.forEach((p,pi)=>{
  let pt=0,pg=0,hh=0,hd=0,n=0,d=0;
  p.m.forEach((m,mi)=>{const id=pi+"-"+mi,s=m[2]||[],w=W(m[1]);
   const lv=leaves(id,s),f=lv.length?lv.filter(k=>state[k]).length/lv.length:(state[id]?1:0);
   pt+=w;pg+=w*f;hh+=m[1];hd+=m[1]*f;n++;if(f===1)d++;
   const li=document.querySelector(`li[data-id="${id}"]`),on=f===1;
   li.classList.toggle("done",on);li.querySelector(".mn").checked=on;
   li.querySelectorAll("input[data-k]").forEach(i=>{const n=+i.dataset.n||0;i.checked=n?Array.from({length:n},(_,j)=>state[i.dataset.k+"."+j]).every(Boolean):!!state[i.dataset.k];i.closest("li").classList.toggle("done",i.checked)});
   li.classList.toggle("hide",(filter==="todo"&&on)||(filter==="done"&&!on))});
  tot+=pt;got+=pg;hTot+=hh;hGot+=hd;
  const sc=$("#p"+pi);sc.classList.toggle("clear",d===n);
  sc.querySelector(".track i").style.width=(pg/pt*100)+"%";
  sc.querySelector(".c").textContent=d+" / "+n;
  sc.querySelector(".hh").textContent=hh?Math.round(hd)+" / "+hh+" hrs":"no set hours"});
 const pc=Math.round(got/tot*100);
 $("#pct").textContent=pc+"%";$("#hrs").textContent=Math.round(hGot)+" / "+hTot+" hrs";
 ring.style.strokeDashoffset=C*(1-got/tot);
 let ri=0;RANKS.forEach((r,i)=>{if(pc>=r[0])ri=i});if(got===0)ri=0;
 $("#rank").textContent=RANKS[ri][1];
 const nx=RANKS[ri+1];
 $("#next").textContent=pc===100?"Mission complete. Go build something heroic.":nx?"Next rank: "+nx[1]+" at "+nx[0]+"%":"";
}
document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{
 filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()}));
$("#reset").addEventListener("click",()=>{if(confirm("Reset all progress?")){state={};save();render()}});
render();
/* starfield */
(function(){const c=$("#sky"),x=c.getContext("2d");let w,h,S=[];
 const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;S=Array.from({length:Math.min(120,w/9|0)},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.6+.3,g:Math.random()<.12}))};
 rs();addEventListener("resize",rs);
 const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 (function f(){x.clearRect(0,0,w,h);S.forEach(s=>{x.fillStyle=s.g?"#f6b93b":"#9fb0d6";x.globalAlpha=.25+s.z/3;
   x.fillRect(s.x,s.y,s.z*1.5,s.z*1.5);if(!still){s.y+=s.z*.15;if(s.y>h){s.y=0;s.x=Math.random()*w}}});
  if(!still)requestAnimationFrame(f)})()})();
</script>
</body>
</html>
